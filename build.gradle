plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-neoforge" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach { gameDirectory = project.file("run/${name}") }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

repositories {
    maven { name = 'CurseMaven'; url = 'https://cursemaven.com' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
}

// 与 Forge 分支同理：Confluence 的 jarJar 内嵌库（Confluence-Magic-Lib / TerraCurio）
// 不会自动进入编译类路径，这里从唯一的 CurseForge 坐标解出来。
configurations {
    confluenceDist
}

dependencies {
    confluenceDist 'curse.maven:confluence-1209464:8940190'
}

def confluenceLibsDir = layout.buildDirectory.dir('confluence-libs')

def extractConfluenceLibs = tasks.register('extractConfluenceLibs', Sync) {
    from({ zipTree(configurations.confluenceDist.singleFile) }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { it.relativePath = new RelativePath(true, it.name) }
        includeEmptyDirs = false
    }
    into confluenceLibsDir
}

dependencies {
    compileOnly files({ configurations.confluenceDist.singleFile })
    compileOnly files({ confluenceLibsDir.get().asFile.listFiles() }).builtBy(extractConfluenceLibs)
}

// 仅用于开发环境启动（runServer / runClient）的依赖，不进入发布的 jar。
// Confluence 强制依赖 curios；TACZ 与 GunsmithLib 用于验证词条属性映射。
dependencies {
    runtimeOnly 'maven.modrinth:curios:9.5.1+1.21.1'
    // 用版本 id 而不是版本号，否则 Modrinth 会解析到 Fabric 主文件
    runtimeOnly 'maven.modrinth:geckolib:Grwn5rUB'
    runtimeOnly 'maven.modrinth:terrablender:6e8GCrLb'
    runtimeOnly 'maven.modrinth:OypNE65K:1.1.8-hotfix-r6'
    runtimeOnly 'curse.maven:confluence-1209464:8940190'
    if (file('libs/gunsmithlib-1.21.1.jar').exists()) {
        runtimeOnly files('libs/gunsmithlib-1.21.1.jar')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(ProcessResources).configureEach {
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand project.properties
    }
}
