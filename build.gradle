plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach { gameDirectory = project.file("run/${name}") }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

repositories {
    maven { name = 'CurseMaven'; url = 'https://cursemaven.com' }
    maven { name = 'Confluence'; url = 'https://maven.confluence.ink/releases' }
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

// 编译期依赖：Confluence 发布物 及其 jarJar 内置库（Magic-Lib / TerraCurio）。
// 目标是 1.20.1 Forge，发布物为 SRG 名；本模组只引用其中模组自身定义的方法名，
// 且不直接调用 Minecraft 成员，因此以文件形式加入编译类路径即可。
dependencies {
    compileOnly files('libs/confluence-1.20.1.jar')
    compileOnly files('libs/org.confluence.lib.confluence_magic_lib-1.3.0.jar')
    compileOnly files('libs/org.confluence.mod.TerraCurio-forge-1.3.1.4+1.20.1.jar')

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(ProcessResources).configureEach {
    filesMatching(['META-INF/mods.toml']) {
        expand project.properties
    }
}

jar {
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json")
}
