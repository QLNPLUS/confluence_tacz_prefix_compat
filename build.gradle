plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach { gameDirectory = project.file("run/${name}") }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

repositories {
    maven { name = 'CurseMaven'; url = 'https://cursemaven.com' }
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

// Confluence 发布物本身无法直接提供编译所需的全部类型：它把 Confluence-Magic-Lib 与
// TerraCurio 通过 jarJar 内嵌在 META-INF/jarjar 下，而 Gradle 不会把内嵌 jar 放进编译类路径。
// 这里从 Confluence 的 CurseForge 坐标里把内嵌库解出来；TACZ 和 PortLib API 则单独声明编译依赖。
configurations {
    confluenceDist
}

dependencies {
    confluenceDist 'curse.maven:confluence-1209464:8940876'
    compileOnly 'curse.maven:timeless-and-classics-zero-1028108:8055552'
    compileOnly 'curse.maven:mesdagportlib-1643194:8940829'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

def confluenceLibsDir = layout.buildDirectory.dir('confluence-libs')

def extractConfluenceLibs = tasks.register('extractConfluenceLibs', Sync) {
    from({ zipTree(configurations.confluenceDist.singleFile) }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { it.relativePath = new RelativePath(true, it.name) }
        includeEmptyDirs = false
    }
    into confluenceLibsDir
}

dependencies {
    compileOnly files({ configurations.confluenceDist.singleFile })
    compileOnly files({ confluenceLibsDir.get().asFile.listFiles() }).builtBy(extractConfluenceLibs)
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(ProcessResources).configureEach {
    filesMatching(['META-INF/mods.toml']) {
        expand project.properties
    }
}

jar {
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json")
}
